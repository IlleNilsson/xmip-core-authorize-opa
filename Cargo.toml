[package]
name = "xmip-core-authorize-opa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authorize-opa"
description = "Authorization by a decision fetched from an Open Policy Agent over its REST data API, asked only where the node is online or the agent is on loopback; an agent that is not asked, or does not answer, is a denial, never a permit and never an abstention. A xmip-core-authorize technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The facts it judges are context's and the layer it
# answers for is core's.
authorize = { package = "xmip-core-authorize", git = "https://github.com/IlleNilsson/xmip-core-authorize", branch = "main" }
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

# The input document and the answer are JSON; the HTTP/1.1 around them is
# the estate's minimal client over std TCP (no client crate, no runtime).
serde_json = "1"
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }

[dev-dependencies]
# A loopback address no one holds, for what a test wants nothing listening
# at or binds later (`net::fixture::unheld`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", features = ["test-support"] }

[lints]
workspace = true
